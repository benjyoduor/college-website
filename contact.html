<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <style>
        h3{
        color:blue;
        font-size:32px;
        text-align:center;
        text-decoration:underline;
        }
        form{
        background-color:orange;
        padding:20px;
        width:400px;
        border-radius:15px;
        }
        button{ background-color:black;
        color:white;
        border-radius:15px;
        }
        labels
    </style>
</head>
<body>
<h3>Contact Form</h3>
<form action="">
    <label>NAME:</label>
    <input type="text"><br> <br>

    <label>EMAIL:</label>
    <input type="email"> <br><br>

    <label>DEPARTMENT</label>
    <select>
        <option value="Science Department"></option>
        <option value="English Department"></option>
        <option value="Kiswahili Department"></option>
        <option value="Mathematics Department"></option>
    </select> <br> <br>

    <label>Comment:</label> <br>
    <textarea name="" id="" cols="30" rows="10"></textarea> <br> <br>
    <button>SUBMIT</button>

</form>

</body>
</html>
